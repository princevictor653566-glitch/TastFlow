<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="art">
        <div class="auth-box">
            <h1>Register</h1>
            <p class="subtitle">
                Let's get you all set up to verify your account and begin 
                your profile
            </p>
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" placeholder="Your First Name Here" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" placeholder="Your Last Name Here" required>

                    </div>
                </div>
              <div class="form-row">
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="text" id="reg-email" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>
              </div>  
              
              <div class="form-row">
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <input type="password" id="reg-password" placeholder="Enter your Password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your Password" required>
                </div>
              </div>  
              <div class="checkbox">
                <label><input type="checkbox" required>I agree all the Terms, Privacy Policy and Fees</label>
              </div>
              <button type="submit" class="auth-button" >
                <a href="tast.html">Create Account</a>
              </button>
              <button type="button" class="goggle-button">
                <span class="google-icon">G</span>
                Sign up with Goggle
              </button>
            </form>
            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Sign in</a>
            
            </p>

        </div>










    </div>
</body>
</html>
